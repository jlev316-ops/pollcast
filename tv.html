<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollCast TV Lower Third</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="tv-body">
<div class="tv-stage">
  <div class="tv-bg"></div>
  <div class="tv-logo-zone" id="logoZone"></div>
  <div class="tv-question-box"><div class="tv-question" id="question"></div></div>
  <div class="tv-options" id="options"></div>
  <div class="tv-qr-zone" id="qrZone"></div>
  <div class="tv-footer" id="footer"></div>
</div>
<script src="shared.js"></script>
<script>
function render(){
  const state = PollCast.loadState();
  const poll = PollCast.getPollFromUrl(state);
  document.getElementById('logoZone').innerHTML = state.settings.logo ? `<img src="${state.settings.logo}" alt="logo">` : '<div class="tv-logo-placeholder">SHOW<br>LOGO</div>';
  document.getElementById('qrZone').innerHTML = state.settings.qr ? `<img src="${state.settings.qr}" alt="QR">` : '<div class="tv-qr-placeholder">QR<br>CODE</div>';
  document.getElementById('footer').textContent = state.settings.footerUrl || '';
  const q = document.getElementById('question');
  q.textContent = poll.question || '';
  PollCast.fitText(q, 28, 16);

  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  poll.options.slice(0,4).forEach(opt => {
    const pct = PollCast.percent(opt, poll);
    const div = document.createElement('div');
    div.className = 'tv-option' + (opt.image ? '' : ' no-image');
    div.innerHTML = `${opt.image ? `<img class="tv-option-img" src="${opt.image}" alt="">` : ''}<div class="tv-option-label">${opt.label}</div><div class="tv-option-pct">${pct}%</div>`;
    wrap.appendChild(div);
    PollCast.fitText(div.querySelector('.tv-option-label'), poll.options.length >= 4 ? 18 : 21, 10);
    PollCast.fitText(div.querySelector('.tv-option-pct'), poll.options.length >= 4 ? 31 : 38, 18);
  });
}
render();
window.addEventListener('storage', render);
window.addEventListener('pollcast:update', render);
setInterval(render, 1000);
</script>
</body>
</html>
