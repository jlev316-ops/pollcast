<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollCast Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">PollCast Dashboard</div>
    <div class="card">
      <h2>Polls</h2>
      <div id="pollList" class="poll-list"></div>
      <button class="btn primary" id="newPollBtn">+ New Poll</button>
    </div>
    <div class="card">
      <h2>Output URLs</h2>
      <label>TV lower third</label>
      <div class="url-box" id="tvUrl"></div>
      <button class="btn" id="copyTv">Copy TV URL</button>
      <label>WordPress widget</label>
      <div class="url-box" id="widgetUrl"></div>
      <button class="btn" id="copyWidget">Copy Widget URL</button>
      <label>WordPress iframe code</label>
      <div class="url-box" id="iframeCode"></div>
      <button class="btn" id="copyIframe">Copy iframe</button>
    </div>
    <div class="card notice">
      This clean build works immediately for same-browser testing. For real fan voting from WordPress across devices, the next step is connecting a small cloud database.
    </div>
  </aside>

  <main class="main">
    <div class="card">
      <h2>Poll Setup</h2>
      <label>Internal title</label>
      <input id="titleInput">
      <label>Question</label>
      <textarea id="questionInput"></textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" id="savePollBtn">Save Poll</button>
        <button class="btn danger" id="deletePollBtn">Delete Poll</button>
      </div>
    </div>

    <div class="card">
      <h2>Answers 2-4</h2>
      <div id="optionsEditor"></div>
      <button class="btn" id="addOptionBtn">+ Add Answer</button>
    </div>

    <div class="card">
      <h2>Assets</h2>
      <label>Show logo PNG</label>
      <button class="btn file-btn">Upload Logo <input type="file" id="logoInput" accept="image/*"></button>
      <button class="btn danger" id="clearLogoBtn">Clear Logo</button>
      <label>QR code PNG</label>
      <button class="btn file-btn">Upload QR <input type="file" id="qrInput" accept="image/*"></button>
      <button class="btn danger" id="clearQrBtn">Clear QR</button>
      <label>Footer URL text</label>
      <input id="footerInput">
    </div>

    <div class="card">
      <h2>Live Controls</h2>
      <div class="row">
        <button class="btn primary" id="openTvBtn">Open TV Lower Third</button>
        <button class="btn primary" id="openWidgetBtn">Open Widget</button>
      </div>
      <label>Simulate votes</label>
      <div id="voteButtons" class="row" style="flex-wrap:wrap;"></div>
      <button class="btn danger" id="resetVotesBtn" style="margin-top:10px;">Reset Votes</button>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script>
let state = PollCast.loadState();
let activeId = state.activePollId;

function activePoll(){ return state.polls.find(p => p.id === activeId) || state.polls[0]; }
function base(){ return location.href.replace(/index\.html.*$/,'').replace(/\?.*$/,''); }
function urls(){ const p=activePoll(); return { tv:`${base()}tv.html?poll=${p.id}`, widget:`${base()}widget.html?poll=${p.id}` }; }
function save(){ state.activePollId = activeId; PollCast.saveState(state); render(); }

function render(){
  const p = activePoll();
  document.getElementById('pollList').innerHTML = state.polls.map(poll => `<button class="btn ${poll.id===activeId?'active':''}" onclick="selectPoll('${poll.id}')">${poll.title || poll.question || 'Untitled poll'}</button>`).join('');
  document.getElementById('titleInput').value = p.title || '';
  document.getElementById('questionInput').value = p.question || '';
  document.getElementById('footerInput').value = state.settings.footerUrl || '';

  const u = urls();
  document.getElementById('tvUrl').textContent = u.tv;
  document.getElementById('widgetUrl').textContent = u.widget;
  document.getElementById('iframeCode').textContent = `<iframe src="${u.widget}" width="100%" height="520" style="border:0;"></iframe>`;

  const optWrap = document.getElementById('optionsEditor');
  optWrap.innerHTML = '';
  p.options.forEach((opt, index) => {
    const row = document.createElement('div');
    row.className = 'option-edit';
    row.innerHTML = `
      <input value="${opt.label || ''}" placeholder="Answer" oninput="updateOptionLabel(${index}, this.value)">
      <input type="number" value="${opt.votes || 0}" min="0" oninput="updateOptionVotes(${index}, this.value)">
      <button class="btn file-btn">Image <input type="file" accept="image/*" onchange="uploadOptionImage(event, ${index})"></button>
      <button class="btn danger" onclick="removeOption(${index})">×</button>`;
    optWrap.appendChild(row);
  });
  document.getElementById('addOptionBtn').disabled = p.options.length >= 4;
  document.getElementById('voteButtons').innerHTML = p.options.map((opt,i)=>`<button class="btn" onclick="addVote(${i})">+1 ${opt.label}</button>`).join('');
}

window.selectPoll = id => { activeId = id; state.activePollId = id; save(); };
window.updateOptionLabel = (i, v) => { activePoll().options[i].label = v; PollCast.saveState(state); };
window.updateOptionVotes = (i, v) => { activePoll().options[i].votes = Math.max(0, Number(v || 0)); PollCast.saveState(state); render(); };
window.removeOption = i => { const p=activePoll(); if(p.options.length<=2) return alert('Minimum 2 answers'); p.options.splice(i,1); save(); };
window.uploadOptionImage = async (e, i) => { const file=e.target.files[0]; if(!file) return; activePoll().options[i].image = await PollCast.fileToDataUrl(file); save(); };
window.addVote = i => { activePoll().options[i].votes = Number(activePoll().options[i].votes || 0) + 1; save(); };

document.getElementById('newPollBtn').onclick = () => {
  const id = PollCast.uid();
  state.polls.push({ id, title:'New Poll', question:'Type your question here', status:'active', createdAt:new Date().toISOString(), options:[{id:PollCast.uid(),label:'Answer 1',votes:0,image:''},{id:PollCast.uid(),label:'Answer 2',votes:0,image:''}] });
  activeId = id; save();
};
document.getElementById('savePollBtn').onclick = () => { const p=activePoll(); p.title=document.getElementById('titleInput').value; p.question=document.getElementById('questionInput').value; state.settings.footerUrl=document.getElementById('footerInput').value; save(); };
document.getElementById('deletePollBtn').onclick = () => { if(state.polls.length<=1) return alert('Need at least one poll'); if(!confirm('Delete this poll?')) return; state.polls = state.polls.filter(p=>p.id!==activeId); activeId=state.polls[0].id; save(); };
document.getElementById('addOptionBtn').onclick = () => { const p=activePoll(); if(p.options.length>=4) return; p.options.push({id:PollCast.uid(),label:`Answer ${p.options.length+1}`,votes:0,image:''}); save(); };
document.getElementById('resetVotesBtn').onclick = () => { activePoll().options.forEach(o=>o.votes=0); save(); };
document.getElementById('openTvBtn').onclick = () => window.open(urls().tv, '_blank');
document.getElementById('openWidgetBtn').onclick = () => window.open(urls().widget, '_blank');
document.getElementById('copyTv').onclick = () => PollCast.copyText(urls().tv);
document.getElementById('copyWidget').onclick = () => PollCast.copyText(urls().widget);
document.getElementById('copyIframe').onclick = () => PollCast.copyText(document.getElementById('iframeCode').textContent);
document.getElementById('logoInput').onchange = async e => { const f=e.target.files[0]; if(!f) return; state.settings.logo = await PollCast.fileToDataUrl(f); save(); };
document.getElementById('qrInput').onchange = async e => { const f=e.target.files[0]; if(!f) return; state.settings.qr = await PollCast.fileToDataUrl(f); save(); };
document.getElementById('clearLogoBtn').onclick = () => { state.settings.logo=''; save(); };
document.getElementById('clearQrBtn').onclick = () => { state.settings.qr=''; save(); };

render();
</script>
</body>
</html>
